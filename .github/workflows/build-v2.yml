name: Build V2 reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the V2 reference
        run: python tools/build_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: cislunar-v2-reference
          path: index.html
          retention-days: 14
