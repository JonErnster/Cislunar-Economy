name: Build Earth–Moon–Mars Atlas V3
on:
  workflow_dispatch:
  push:
    branches: [v3-earth-moon-mars]
    paths:
      - 'src/interplanetary.js'
      - 'tools/generate_transfers.py'
      - 'tools/build_v3.py'
      - 'tests/check_v3.py'
      - 'requirements-v3.txt'
      - '.github/workflows/build-v3.yml'
permissions:
  contents: write
concurrency:
  group: v3-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and browser dependencies
        run: |
          python -m pip install -r requirements-v3.txt
          python -m playwright install --with-deps chromium
      - name: Calculate and independently validate transfer solutions
        run: |
          OPENBLAS_NUM_THREADS=1 python tools/generate_transfers.py
      - name: Build the standalone atlas
        run: |
          node --check src/interplanetary.js
          python tools/build_v3.py
      - name: Verify original Map and V3 desktop/mobile interactions
        run: python -u tests/check_v3.py
      - name: Commit the verified application and evidence
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/interplanetary.json docs/v3-*.json docs/v3-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V3 Earth–Moon–Mars Atlas and verified transfer catalogue'
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "Build commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          cat docs/v3-build-verification.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: earth-moon-mars-atlas-v3
          path: |
            index.html
            data/interplanetary.json
            docs/v3-*.json
            docs/v3-*.png
          retention-days: 14
