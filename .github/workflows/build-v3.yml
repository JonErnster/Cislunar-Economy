name: Verify published Atlas
on:
  workflow_dispatch:
  push:
    branches: [verify/atlas-release-2026-11-20]
    paths:
      - 'src/interplanetary.js'
      - 'tools/generate_transfers.py'
      - 'tools/build_v3.py'
      - 'tests/check_v3.py'
      - 'requirements-v3.txt'
      - '.github/workflows/build-v3.yml'
permissions:
  contents: read
concurrency:
  group: v3-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical and browser dependencies
        run: |
          python -m pip install -r requirements-v3.txt
          python -m playwright install --with-deps chromium
      - name: Calculate and independently validate transfer solutions
        run: |
          OPENBLAS_NUM_THREADS=1 python tools/generate_transfers.py
      - name: Build the standalone atlas
        run: |
          node --check src/interplanetary.js
          python tools/build_v3.py
      - name: Verify published bytes and register evidence
        run: |
          git diff --exit-code -- index.html data/interplanetary.json docs/*verification.json
          python tools/build_communications.py --check
          python tests/check_communications.py
      - name: Verify original Map and V3 desktop/mobile interactions
        run: python -u tests/check_v3.py
